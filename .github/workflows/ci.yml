name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon version
      - run: moon check --deny-warn
      - run: moon test --deny-warn
      - run: moon build
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: moon run cmd/main -- demo
